<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claudey Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23ff4d00%22%20d%3D%22M13.827%203.52h3.603L24%2020h-3.603l-6.57-16.48zm-7.258%200h3.767L16.906%2020h-3.674l-1.343-3.461H5.017l-1.344%203.46H0L6.57%203.522zm4.132%209.959L8.453%207.687%206.205%2013.48H10.7z%22%2F%3E%3C%2Fsvg%3E"
    />
    <link rel="stylesheet" href="/admin/assets/admin.css?v=5.18.1" />
    <link rel="stylesheet" href="/admin/assets/admin-animations.css?v=5.18.1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-label="Claudey">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
              <path d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017l-1.344 3.46H0L6.57 3.522zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>Claudey</h1>
            <p>Server Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
        <div class="sidebar-footer">
          <div id="sidebarBudget" class="sidebar-budget" hidden>
            <div class="sidebar-budget-row">
              <span id="sidebarBudgetLeft" class="sidebar-budget-left"></span>
              <button
                id="sidebarBudgetStat"
                class="sidebar-budget-stat"
                type="button"
                title="View usage"
                aria-label="View usage"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
              </button>
            </div>
            <div
              id="sidebarBudgetBar"
              class="sidebar-budget-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-label="Credits remaining"
            >
              <div id="sidebarBudgetFill" class="sidebar-budget-fill"></div>
            </div>
            <div class="sidebar-budget-meta">
              <span id="sidebarBudgetReset" class="sidebar-budget-reset"></span>
              <a id="sidebarBudgetUpgrade" href="#" class="sidebar-budget-link">
                Upgrade
              </a>
            </div>
          </div>
          <a
            id="sidebarCollapseBtn"
            href="#"
            class="sidebar-collapse-btn"
            hidden
          >
            <span class="sidebar-collapse-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </span>
            <span class="sidebar-collapse-label">Collapse</span>
          </a>
          <button
            id="sidebarToggle"
            class="sidebar-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="sectionNav"
            aria-label="Unpin sidebar"
            title="Unpin sidebar"
            hidden
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 5.5L7 12l6.5 6.5" /><path d="M18.5 5.5L12 12l6.5 6.5" /></svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <p id="welcomeGreeting" class="welcome-greeting" aria-live="polite"></p>
          <div class="topbar-row">
            <h2 id="pageTitle">Providers</h2>
            <div
              id="serverStatusPill"
              class="server-status checking"
              role="status"
              title="Claudey server health"
            ></div>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-providers" class="admin-view active" data-view="providers">
            <section class="scout-dashboard" aria-label="Claudey activity dashboard">
              <div class="scout-header">
                <div class="scout-brand" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017l-1.344 3.46H0L6.57 3.522zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z" /></svg>
                </div>
                <p id="scoutTitle" class="scout-title" aria-live="polite">Scout searching in progress</p>
              </div>
              <div class="scout-body">
                <div id="scoutStats" class="scout-stats">
                  <div class="scout-stat-row">
                    <span class="scout-stat-label">Agents</span>
                    <span class="scout-stat-value" data-final="0">0 found</span>
                  </div>
                  <div class="scout-stat-row">
                    <span class="scout-stat-label">Skills</span>
                    <span class="scout-stat-value" data-final="0">0 found</span>
                  </div>
                </div>
                <div class="scout-panel">
                  <div class="scout-input">
                    <svg class="scout-search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                      <path d="M16.875 16.875L13.4388 13.4388M13.4388 13.4388C14.5321 12.3454 15.2083 10.835 15.2083 9.16667C15.2083 5.82995 12.5034 3.125 9.16667 3.125C5.82995 3.125 3.125 5.82995 3.125 9.16667C3.125 12.5034 5.82995 15.2083 9.16667 15.2083C10.835 15.2083 12.3454 14.5321 13.4388 13.4388Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.4" stroke-width="1.25" />
                    </svg>
                    <span id="scoutQuery" class="scout-query">Searching...</span>
                    <span id="scoutCursor" class="scout-cursor scout-cursor-hidden" aria-hidden="true">|</span>
                  </div>
                  <div class="scout-viewport">
                    <div id="scoutTrack" class="scout-track"></div>
                  </div>
                </div>
              </div>
            </section>
            <div id="onboardingCard" class="onboarding-card" hidden></div>
            <section
              id="connectedAccountsSection"
              class="provider-strip"
              aria-label="Connected accounts"
              hidden
            >
              <div class="strip-header">
                <div>
                  <h3>Connected accounts</h3>
                  <p>Use an existing subscription without storing credentials in .env.</p>
                </div>
              </div>
              <div id="connectedAccountGrid" class="provider-grid"></div>
            </section>
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <div>
                  <h3>Providers</h3>
                  <p>Configure endpoints, keys, and models for each provider.</p>
                </div>
                <div class="provider-actions">
                  <button id="addOpenAIProviderBtn" class="secondary-button" type="button">
                    Add OpenAI-compatible
                  </button>
                  <button id="addAnthropicProviderBtn" class="secondary-button" type="button">
                    Add Anthropic-compatible
                  </button>
                </div>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>

          <section id="view-usage" class="admin-view" data-view="usage" hidden>
            <div
              id="usageSections"
              class="form-sections"
              aria-label="Token usage"
            ></div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button
            id="restartButton"
            class="secondary-button"
            type="button"
            title="Stop and start the local Claudey server"
          >
            Restart server
          </button>
          <button
            id="validateButton"
            class="secondary-button"
            type="button"
            aria-keyshortcuts="Control+S Meta+S"
          >
            Validate
          </button>
          <button
            id="applyButton"
            class="primary-button"
            type="button"
            aria-keyshortcuts="Control+Enter Meta+Enter"
            disabled
          >
            Apply
          </button>
        </div>
      </footer>
    </div>
    <div
      id="toastContainer"
      class="toast-container"
      aria-live="polite"
      aria-label="Notifications"
    ></div>
    <script src="/admin/assets/admin.js?v=5.18.1"></script>
    <script type="module" src="/admin/assets/admin-animations.js?v=5.18.1"></script>
  </body>
</html>
